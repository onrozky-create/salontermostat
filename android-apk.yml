name: Salon Termostatı APK derle
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: Android SDK kur
        uses: android-actions/setup-android@v3
      - name: Gerekli Android bileşenlerini kur
        run: yes | sdkmanager --licenses >/dev/null; sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
      - name: Debug APK derle
        run: gradle --no-daemon assembleDebug
      - name: APK dosyasını yayınla
        uses: actions/upload-artifact@v4
        with:
          name: Salon-Termostati-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
